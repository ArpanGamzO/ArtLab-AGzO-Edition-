
name: Build ART LAB APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          mkdir source
          unzip -q artlabagzo.zip -d source

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies and generate Android project
        run: |
          PROJECT_DIR=$(find source -type f -name package.json -not -path '*/node_modules/*' -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "package.json not found"
            exit 1
          fi
          cd "$PROJECT_DIR"
          npm install
          npx expo prebuild --platform android --non-interactive
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ART-LAB-AGzO-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
