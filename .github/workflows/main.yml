
name: Build ART LAB APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          mkdir project
          unzip -q artlabagzo.zip -d project

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: project
        run: npm ci

      - name: TypeScript check
        working-directory: project
        run: npm run typecheck

      - name: Generate Android project
        working-directory: project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: '1'

      - name: Build Release APK
        working-directory: project/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ART-LAB-AGzO-Release-APK
          path: project/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          
